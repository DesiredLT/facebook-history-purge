name: Build Vaeloria Android APK

on:
  push:
    branches:
      - agent/vaeloria-local-android
    paths:
      - 'vaeloria-android/**'
      - '.github/workflows/vaeloria-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaeloria-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
      - name: Create stable Android signing key on first run
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Vaeloria Local Android,O=Vaeloria,C=LT" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Integrate full statistics and gameplay checks
        run: |
          python3 tools/patch_stats_button.py
          python3 tools/fix_generated_java.py
      - name: Verify all 92 stats are real mechanics
        run: |
          python3 - <<'PY'
          import re
          catalog=open('app/src/main/java/lt/vaeloria/ooc/BaseStatCatalog.java',encoding='utf-8').read()
          engine=open('app/src/main/java/lt/vaeloria/ooc/StatEngine.java',encoding='utf-8').read()
          groups=re.findall(r'new Group\("[^"]+",(.*?)\)(?:,|\n\s*\})',catalog,re.S)
          stats=[]
          for g in groups:
              stats += re.findall(r'"([^"]+)"',g)
          print('Base stat count:',len(stats))
          if len(stats) != 92:
              raise SystemExit(f'Expected 92 stats, found {len(stats)}')
          missing=[s for s in stats if ('"'+s+'"') not in engine]
          if missing:
              raise SystemExit('Stats without mechanical reference: '+', '.join(missing))
          print('Mechanically referenced:',len(stats),'of 92')
          PY
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-v0.3.1-build-log
          path: vaeloria-android/build.log
          if-no-files-found: warn
      - name: Prepare APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Vaeloria-OOC-v0.3.1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.3.1-apk
          path: vaeloria-android/app/build/outputs/apk/debug/Vaeloria-OOC-v0.3.1.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.3.1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.3.1 \
            app/build/outputs/apk/debug/Vaeloria-OOC-v0.3.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vaeloria OOC v0.3.1" \
            --notes "Adds all 92 Lithuanian base stats as real SQLite-backed gameplay values. Every stat is mechanically addressable. Each risky action selects a primary and supporting stat, combines them 75/25, then applies a local d100 roll, situation difficulty, resources, equipment and post-cap abilities before the AI GM narrates the fixed result. Includes the full searchable 92-stat screen and all v0.3 equipment, localization, map and UI improvements."
