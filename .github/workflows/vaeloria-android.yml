name: Build Vaeloria Android APK

on:
  push:
    branches:
      - agent/vaeloria-local-android
    paths:
      - 'vaeloria-android/**'
      - '.github/workflows/vaeloria-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaeloria-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
          fail-on-cache-miss: true
      - name: Verify pinned signing key
        run: |
          test -f "$HOME/.android/debug.keystore"
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "Pinned key SHA256=$FP"
          test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Integrate 92-stat engine
        run: |
          python3 tools/patch_stats_button.py
          python3 tools/fix_generated_java.py
          python3 tools/patch_stat_engine_audit.py
          python3 tools/patch_stat_test_aggregate.py
      - name: Integrate v0.4 systems and interface
        run: |
          python3 tools/patch_v040.py
          python3 tools/fix_v040_db_methods.py
          python3 tools/cleanup_v040_lithuanian.py
      - name: Integrate v0.5 reliability fixes
        run: python3 tools/patch_v050.py
      - name: Verify all 92 stats are real mechanics
        run: |
          python3 - <<'PY'
          import re
          catalog=open('app/src/main/java/lt/vaeloria/ooc/BaseStatCatalog.java',encoding='utf-8').read()
          engine=open('app/src/main/java/lt/vaeloria/ooc/StatEngine.java',encoding='utf-8').read()
          groups=re.findall(r'new Group\("[^"]+",(.*?)\)(?:,|\n\s*\})',catalog,re.S)
          stats=[]
          for g in groups: stats += re.findall(r'"([^"]+)"',g)
          print('Base stat count:',len(stats))
          if len(stats)!=92: raise SystemExit(f'Expected 92 stats, found {len(stats)}')
          if len(set(stats))!=92: raise SystemExit('Duplicate base stat names found')
          missing=[s for s in stats if ('"'+s+'"') not in engine]
          if missing: raise SystemExit('Stats without mechanical reference: '+', '.join(missing))
          print('Mechanically referenced:',len(stats),'of 92')
          PY
      - name: Verify v0.5 integration and Lithuanian UI
        run: |
          grep -q 'private static final int VERSION = 5' app/src/main/java/lt/vaeloria/ooc/VaeloriaDb.java
          grep -q 'CREATE TABLE mastery' app/src/main/java/lt/vaeloria/ooc/VaeloriaDb.java
          grep -q 'private void migrateV4toV5(SQLiteDatabase db)' app/src/main/java/lt/vaeloria/ooc/VaeloriaDb.java
          grep -q 'private void seedMastery(SQLiteDatabase db)' app/src/main/java/lt/vaeloria/ooc/VaeloriaDb.java
          grep -q 'MasteryEngine.apply' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'CharacterLoadoutView' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'AbilityMechanics.mechanic' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'max_completion_tokens' app/src/main/java/lt/vaeloria/ooc/GroqClient.java
          grep -q 'o.put("time_minutes",0)' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'k.startsWith("gsk_")' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          ! grep -q 'VIETINIS RPG' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          ! grep -q 'post-cap' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          ! grep -q ' IR XP' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          ! grep -q 'post-cap\|POST-CAP\| XP' app/src/main/java/lt/vaeloria/ooc/StatsActivity.java app/src/main/java/lt/vaeloria/ooc/AbilityMechanics.java
      - name: Run 92-stat and mastery tests
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "--- FAILED TEST DETAILS ---"
            find app/build/test-results/testDebugUnitTest -type f -name '*.xml' -print -exec cat {} \; || true
          fi
          exit "$code"
      - name: Build v0.5.0 APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Vaeloria-OOC-v0.5.0.apk
      - name: Verify APK identity and signer
        run: |
          APK=app/build/outputs/apk/debug/Vaeloria-OOC-v0.5.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1 | tee apk-identity.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-identity.txt
          grep -q "versionCode='12'" apk-identity.txt
          CERT=$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "APK signer SHA256=$CERT"
          test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-v0.5.0-build-log
          path: vaeloria-android/build.log
          if-no-files-found: warn
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.5.0-apk
          path: vaeloria-android/app/build/outputs/apk/debug/Vaeloria-OOC-v0.5.0.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.5.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.5.0 \
            app/build/outputs/apk/debug/Vaeloria-OOC-v0.5.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vaeloria OOC v0.5.0" \
            --notes "Vietinis Android Vaeloria leidimas su kanonine Luminara / Lūžusio Meridiano būsena, 92 realiai veikiančiomis bazinėmis savybėmis, meistriškumo ir įrangos sistemomis, vietiniu SQLite išsaugojimu, Android Keystore saugomu Groq raktu ir gpt-oss-120b žaidimo meistru. v0.5.0 prideda Groq retry/backoff ir atsakymo ribas, griežtesnį API rakto tikrinimą bei užtikrina, kad offline atsarginis režimas nekeistų kanoninio pasaulio laiko. Paketas ir pasirašymo raktas išlieka tie patys kaip v0.4.1, todėl versija atsinaujina vietoje."
