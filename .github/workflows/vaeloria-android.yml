name: Build Vaeloria Android APK

on:
  push:
    branches:
      - agent/vaeloria-local-android
    paths:
      - 'vaeloria-android/**'
      - '.github/workflows/vaeloria-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaeloria-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
      - name: Create stable Android signing key on first run
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Vaeloria Local Android,O=Vaeloria,C=LT" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Integrate full statistics screen
        run: python3 tools/patch_stats_button.py
      - name: Verify exactly 92 base stats
        run: |
          python3 - <<'PY'
          import re
          text=open('app/src/main/java/lt/vaeloria/ooc/BaseStatCatalog.java',encoding='utf-8').read()
          groups=re.findall(r'new Group\("[^"]+",(.*?)\)(?:,|\n\s*\})',text,re.S)
          count=sum(len(re.findall(r'"[^"]+"',g)) for g in groups)
          print('Base stat count:',count)
          if count != 92:
              raise SystemExit(f'Expected 92 stats, found {count}')
          PY
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-v0.3.1-build-log
          path: vaeloria-android/build.log
          if-no-files-found: warn
      - name: Prepare APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Vaeloria-OOC-v0.3.1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.3.1-apk
          path: vaeloria-android/app/build/outputs/apk/debug/Vaeloria-OOC-v0.3.1.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.3.1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.3.1 \
            app/build/outputs/apk/debug/Vaeloria-OOC-v0.3.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vaeloria OOC v0.3.1" \
            --notes "Adds the complete canonical 92-base-stat screen: seven Lithuanian categories, every individual stat visible at 100/100, search, and direct access from the character progression card. Keeps the v0.3 equipment, Lithuanian UI, map and AI GM improvements."
