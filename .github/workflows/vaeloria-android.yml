name: Build Vaeloria Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaeloria-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
          fail-on-cache-miss: true
      - name: Verify pinned signing key
        run: |
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "Pinned key SHA256=$FP"
          test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Integrate core systems
        run: |
          python3 tools/patch_stats_button.py
          python3 tools/fix_generated_java.py
          python3 tools/patch_stat_engine_audit.py
          python3 tools/patch_stat_test_aggregate.py
          python3 tools/patch_v040.py
          python3 tools/fix_v040_db_methods.py
          python3 tools/cleanup_v040_lithuanian.py
          python3 tools/patch_v050.py
          python3 tools/patch_v051.py
          python3 tools/patch_v051_lintfix.py
      - name: Verify core before visual layer
        run: |
          grep -q 'private static final int VERSION = 5' app/src/main/java/lt/vaeloria/ooc/VaeloriaDb.java
          grep -q 'CREATE TABLE mastery' app/src/main/java/lt/vaeloria/ooc/VaeloriaDb.java
          grep -q 'MasteryEngine.apply' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'max_completion_tokens' app/src/main/java/lt/vaeloria/ooc/GroqClient.java
          grep -q 'ACTION_CREATE_DOCUMENT' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
      - name: Verify all 92 stats are real mechanics
        run: |
          python3 - <<'PY'
          import re
          catalog=open('app/src/main/java/lt/vaeloria/ooc/BaseStatCatalog.java',encoding='utf-8').read()
          engine=open('app/src/main/java/lt/vaeloria/ooc/StatEngine.java',encoding='utf-8').read()
          groups=re.findall(r'new Group\("[^"]+",(.*?)\)(?:,|\n\s*\})',catalog,re.S)
          stats=[]
          for g in groups: stats += re.findall(r'"([^"]+)"',g)
          if len(stats)!=92 or len(set(stats))!=92: raise SystemExit(f'Expected 92 unique stats, got {len(stats)}')
          missing=[s for s in stats if ('"'+s+'"') not in engine]
          if missing: raise SystemExit('Stats without mechanics: '+', '.join(missing))
          print('Mechanically referenced:',len(stats),'of 92')
          PY
      - name: Install visual build dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Generate v0.6.0 art and install premium views
        run: |
          python3 v060/generate_assets.py
          rm -f app/src/main/java/lt/vaeloria/ooc/WorldMapView.java
          rm -f app/src/main/java/lt/vaeloria/ooc/SceneBannerView.java
          rm -f app/src/main/java/lt/vaeloria/ooc/CombatBoardView.java
          rm -f app/src/main/java/lt/vaeloria/ooc/CharacterLoadoutView.java
          cp v060/PremiumViews.java app/src/main/java/lt/vaeloria/ooc/PremiumViews.java
          cp v060/PremiumActivity.java app/src/main/java/lt/vaeloria/ooc/PremiumActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('app/build.gradle');s=g.read_text();s=re.sub(r'versionCode\s+13\b','versionCode 14',s);s=re.sub(r"versionName\s+'0\.5\.1'","versionName '0.6.0'",s);g.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml');s=m.read_text();s=s.replace('android:label="Vaeloria OOC 0.5.1"','android:label="Vaeloria OOC 0.6.0"');s=s.replace('android:name="lt.vaeloria.ooc.VaeloriaActivity"','android:name="lt.vaeloria.ooc.PremiumActivity"');m.write_text(s)
          PY
      - name: Verify v0.6.0 source and generated art
        run: |
          grep -q 'versionCode 14' app/build.gradle
          grep -q "versionName '0.6.0'" app/build.gradle
          grep -q 'lt.vaeloria.ooc.PremiumActivity' app/src/main/AndroidManifest.xml
          grep -q 'Vaeloria OOC 0.6.0' app/src/main/AndroidManifest.xml
          grep -q 'class PremiumActivity extends VaeloriaActivity' app/src/main/java/lt/vaeloria/ooc/PremiumActivity.java
          grep -q 'PASAULIO ATLASAS' app/src/main/java/lt/vaeloria/ooc/PremiumActivity.java
          grep -q 'class WorldMapView' app/src/main/java/lt/vaeloria/ooc/PremiumViews.java
          test -s app/src/main/res/drawable-nodpi/world_map_v060.png
          test -s app/src/main/res/drawable-nodpi/scene_luminara.png
          test -s app/src/main/res/drawable-nodpi/combat_forest.png
          test -s app/src/main/res/drawable-nodpi/hero_einoras.png
          test -s app/src/main/res/drawable-nodpi/npc_lyra.png
          test -s app/src/main/res/drawable-nodpi/quest_meridian.png
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build v0.6.0 release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vaeloria-OOC-v0.6.0.apk
      - name: Verify APK identity security visuals and signer
        run: |
          APK=app/build/outputs/apk/release/Vaeloria-OOC-v0.6.0.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          head -1 apk-badging.txt | tee apk-identity.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-identity.txt
          grep -q "versionCode='14'" apk-identity.txt
          grep -q "versionName='0.6.0'" apk-identity.txt
          grep -q "application-label:'Vaeloria OOC 0.6.0'" apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          test "$(grep -c '^uses-permission:' apk-permissions.txt)" -eq 1
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest-tree.txt
          if grep -A30 'E: application' apk-manifest-tree.txt | grep -q 'android:debuggable.*0xffffffff'; then echo 'APK is debuggable'; exit 1; fi
          grep -A30 'E: application' apk-manifest-tree.txt | grep -q 'android:allowBackup.*0x0'
          grep -A30 'E: application' apk-manifest-tree.txt | grep -q 'android:usesCleartextTraffic.*0x0'
          unzip -l "$APK" | tee apk-files.txt
          grep -q 'world_map_v060' apk-files.txt
          grep -q 'scene_luminara' apk-files.txt
          grep -q 'hero_einoras' apk-files.txt
          grep -q 'npc_lyra' apk-files.txt
          CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "APK signer SHA256=$CERT"
          test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
          "$APKSIGNER" verify --verbose "$APK"
          if unzip -p "$APK" classes.dex | strings | grep -E 'gsk_[A-Za-z0-9_-]{16,}' >/dev/null; then echo 'Hardcoded Groq key detected'; exit 1; fi
          unzip -p "$APK" classes.dex | strings | grep -q 'PremiumActivity'
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload build audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-v0.6.0-build-audit
          path: |
            vaeloria-android/build.log
            vaeloria-android/apk-identity.txt
            vaeloria-android/apk-badging.txt
            vaeloria-android/apk-permissions.txt
            vaeloria-android/apk-manifest-tree.txt
            vaeloria-android/apk-files.txt
            vaeloria-android/apk-sha256.txt
          if-no-files-found: warn
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.6.0-apk
          path: vaeloria-android/app/build/outputs/apk/release/Vaeloria-OOC-v0.6.0.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.6.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.6.0 \
            app/build/outputs/apk/release/Vaeloria-OOC-v0.6.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vaeloria OOC v0.6.0 · Visual Overhaul" \
            --notes "Presentation-layer perstatymas: iliustruotas offline atlasas, lokacijų scenos, vizualinis kovos ekranas, herojaus ir įrangos kompozicija, inventoriaus ikonografija, NPC dialogų sluoksnis, quest timeline, faction/world-state vizualizacija, nauja tipografijos hierarchija, nav glyphai, animacijos ir haptika. Mechaninis branduolys, SQLite save, 92 savybės, meistriškumas, Groq GM ir Android Keystore išlieka. Release: debuggable=false, allowBackup=false, tik HTTPS, tas pats stabilus signing key."
