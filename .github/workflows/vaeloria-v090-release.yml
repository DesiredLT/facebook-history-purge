name: Release Vaeloria OOC v0.9.0

on:
  push:
    branches: [agent/vaeloria-v090]
    paths:
      - '.github/workflows/vaeloria-v090-release.yml'
      - 'vaeloria-android/app/**'
      - 'vaeloria-android/v090/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify upgrade-compatible signing identity
        run: |
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Source and raster acceptance audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 v090/audit_v090.py

      - name: Unit and save-compatibility tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vaeloria-OOC-v0.9.0.apk

      - name: APK, manifest, permission and signer audit
        run: |
          APK=app/build/outputs/apk/release/Vaeloria-OOC-v0.9.0.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-badging.txt
          grep -q "versionCode='30'" apk-badging.txt
          grep -q "versionName='0.9.0'" apk-badging.txt
          grep -q "application-label:'Vaeloria OOC 0.9.0'" apk-badging.txt
          grep -q "launchable-activity: name='lt.vaeloria.ooc.PolishedActivity'" apk-badging.txt

          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          test "$(grep -c '^uses-permission:' apk-permissions.txt)" -eq 1
          grep -q 'android.permission.INTERNET' apk-permissions.txt

          "$AAPT" dump resources "$APK" | tee apk-resources.txt
          for resource in hero_einoras_v090 scene_luminara_v090 scene_palace_v090 scene_road_v090 scene_forest_v090 scene_combat_v090 scene_meridian_v090 quest_broken_meridian_v090 world_map_base_v090 npc_lyra_v090 npc_varek_v090 npc_brynja_smith_v090 npc_oren_merchant_v090 npc_ilyne_guard_v090 monster_meridian_wolf_v090 monster_void_parasite_v090 monster_meridian_wyrm_v090 item_asterion_blade_v090 item_zero_glass_prism_v090 item_starfall_compass_v090; do
            grep -q "$resource" apk-resources.txt
          done

          CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK"
          if unzip -p "$APK" classes.dex | strings | grep -E 'gsk_[A-Za-z0-9_-]{16,}' >/dev/null; then exit 1; fi
          sha256sum "$APK" | tee apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.9.0-apk
          path: vaeloria-android/app/build/outputs/apk/release/Vaeloria-OOC-v0.9.0.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.9.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.9.0 app/build/outputs/apk/release/Vaeloria-OOC-v0.9.0.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vaeloria OOC v0.9.0 · Premium Dark Fantasy" --notes "Vaeloria v0.9.0 replaces schematic presentation with 70 original bundled premium assets: a full canonical Einoras hero, six reactive scenes, Broken Meridian quest key art, a new interactive atlas with separate state-driven faction overlays, eighteen individual NPC portraits, eighteen monster and world-boss portraits, and twenty-five distinct inventory icons. Luminara now has illustrated merchants, artisans, healers, guards, travelers and other functional residents; the journal includes a lazy-loaded bestiary, and combat selects the active enemy's real portrait by name. The hero and equipment layouts are separated, raw check math is collapsed by default, critical touch targets are at least 44dp, and semantic world-thread cards replace debug-like numbers. Package ID, SQLite save model, offline resolver, Groq GM integration and the stable signing identity are preserved. CI validates source acceptance, every raster decode and hash, save compatibility, unit tests, APK manifest/resources/permissions and signer before publishing."
