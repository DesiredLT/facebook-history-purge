name: Release Vaeloria v0.8.2 Premium Polish R2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
          fail-on-cache-miss: true
      - name: Verify signing identity
        run: |
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
      - uses: android-actions/setup-android@v3
      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply gameplay patches
        run: |
          python3 tools/patch_stats_button.py
          python3 tools/fix_generated_java.py
          python3 tools/patch_stat_engine_audit.py
          python3 tools/patch_stat_test_aggregate.py
          python3 tools/patch_v040.py
          python3 tools/fix_v040_db_methods.py
          python3 tools/cleanup_v040_lithuanian.py
          python3 tools/patch_v050.py
          python3 tools/patch_v051.py
          python3 tools/patch_v051_lintfix.py
          python3 tools/patch_v080_local.py
      - name: Generate v0.8.1 baseline
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 v060/generate_assets.py
          python3 v070/generate_assets_v070.py
          python3 tools/patch_v080_presentation.py
          rm -f app/src/main/java/lt/vaeloria/ooc/WorldMapView.java app/src/main/java/lt/vaeloria/ooc/SceneBannerView.java app/src/main/java/lt/vaeloria/ooc/CombatBoardView.java app/src/main/java/lt/vaeloria/ooc/CharacterLoadoutView.java
          cp v060/PremiumViews.java app/src/main/java/lt/vaeloria/ooc/PremiumViews.java
          cp v060/PremiumActivity.java app/src/main/java/lt/vaeloria/ooc/PremiumActivity.java
          cp v070/PremiumViewsV070.java app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          cp v070/PolishedActivity.java app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java
          python3 v081/generate_assets_v081.py
          python3 v081/patch_v081_ui.py
      - name: Apply v0.8.2 premium implementation
        run: |
          python3 v082/patch_v082.py
          python3 v082/fix_v082_compile.py
      - name: Set v0.8.2 identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('app/build.gradle');s=g.read_text();s=re.sub(r'versionCode\s+\d+','versionCode 20',s);s=re.sub(r"versionName\s+'[^']+'","versionName '0.8.2'",s);g.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml');s=m.read_text();s=re.sub(r'android:label="Vaeloria OOC [^"]+"','android:label="Vaeloria OOC 0.8.2"',s);s=s.replace('android:name="lt.vaeloria.ooc.VaeloriaActivity"','android:name="lt.vaeloria.ooc.PolishedActivity"').replace('android:name="lt.vaeloria.ooc.PremiumActivity"','android:name="lt.vaeloria.ooc.PolishedActivity"');m.write_text(s)
          PY
      - name: Acceptance audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java').read_text();v=Path('app/src/main/java/lt/vaeloria/ooc/PremiumViewsV082.java').read_text();a=Path('app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java').read_text()
          checks=[('save','local(String action,StatEngine.Check check)' in a),('header','OOC · LOCAL FIRST' not in p and 'v0.8.2' in p),('hero','hero_einoras_v082' in p and 'LoadoutV082View' in p),('scene','SceneV082View' in p and 'scene_palace_v082' in v),('feedback','KAIP APSKAIČIUOTA?' in p),('atlas','WorldMapV082View' in p and 'FRAKCIJOS' in p),('journal','"ŽURNALAS"' in p),('quest','quest_meridian_v082' in p),('threads','PRIORITETAS ' in p and 'Paslaptis ' in p),('abilities','NEŽINOMA KLASĖ' in p),('factions','FactionStatusV082View' in p),('shadow-fix','int col=fail?' not in p and 'label;int col;' not in p)]
          for k,x in checks: print(k,'OK' if x else 'FAIL')
          bad=[k for k,x in checks if not x]
          if bad: raise SystemExit(', '.join(bad))
          for f in ['hero_einoras_v082.webp','scene_palace_v082.webp','quest_meridian_v082.webp','world_map_v082.webp']:
              q=Path('app/src/main/res/drawable-nodpi')/f;assert q.exists() and q.stat().st_size>10000,(f,q.stat().st_size if q.exists() else 0)
          PY
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vaeloria-OOC-v0.8.2.apk
      - name: APK audit
        run: |
          APK=app/build/outputs/apk/release/Vaeloria-OOC-v0.8.2.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"; APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-badging.txt
          grep -q "versionCode='20'" apk-badging.txt
          grep -q "versionName='0.8.2'" apk-badging.txt
          grep -q "application-label:'Vaeloria OOC 0.8.2'" apk-badging.txt
          grep -q "launchable-activity: name='lt.vaeloria.ooc.PolishedActivity'" apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          test "$(grep -c '^uses-permission:' apk-permissions.txt)" -eq 1
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
          "$APKSIGNER" verify --verbose "$APK"
          if unzip -p "$APK" classes.dex | strings | grep -E 'gsk_[A-Za-z0-9_-]{16,}' >/dev/null; then exit 1; fi
          unzip -p "$APK" classes.dex | strings | grep -q 'v0.8.2'
          unzip -p "$APK" classes.dex | strings | grep -q 'KAIP APSKAIČIUOTA?'
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.8.2-apk
          path: vaeloria-android/app/build/outputs/apk/release/Vaeloria-OOC-v0.8.2.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.8.2 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.8.2 app/build/outputs/apk/release/Vaeloria-OOC-v0.8.2.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vaeloria OOC v0.8.2 · Premium Dark-Fantasy Polish" --notes "Hero, cinematic scene, collapsed roll math, fantasy atlas + faction layer, Meridian story key-art, player-readable world threads, differentiated ability hierarchy, faction identity cards, cleaner header and ŽURNALAS navigation. Existing saves, local resolver, Groq AI GM, package ID and signing identity preserved."
