name: Release Vaeloria v0.8.0

on:
  push:
    branches:
      - agent/vaeloria-local-android
    paths:
      - '.github/workflows/vaeloria-v080-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore pinned Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify pinned signing key
        run: |
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "Pinned key SHA256=$FP"
          test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Integrate mechanics
        run: |
          python3 tools/patch_stats_button.py
          python3 tools/fix_generated_java.py
          python3 tools/patch_stat_engine_audit.py
          python3 tools/patch_stat_test_aggregate.py
          python3 tools/patch_v040.py
          python3 tools/fix_v040_db_methods.py
          python3 tools/cleanup_v040_lithuanian.py
          python3 tools/patch_v050.py
          python3 tools/patch_v051.py
          python3 tools/patch_v051_lintfix.py

      - name: Verify core mechanics
        run: |
          grep -q 'private static final int VERSION = 5' app/src/main/java/lt/vaeloria/ooc/VaeloriaDb.java
          grep -q 'CREATE TABLE mastery' app/src/main/java/lt/vaeloria/ooc/VaeloriaDb.java
          grep -q 'MasteryEngine.apply' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'Veiksmas pasaulyje' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'Kova prasideda' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'Manifesto neatitikimas' app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re
          catalog=open('app/src/main/java/lt/vaeloria/ooc/BaseStatCatalog.java',encoding='utf-8').read()
          engine=open('app/src/main/java/lt/vaeloria/ooc/StatEngine.java',encoding='utf-8').read()
          groups=re.findall(r'new Group\("[^"]+",(.*?)\)(?:,|\n\s*\})',catalog,re.S)
          stats=[]
          for g in groups: stats += re.findall(r'"([^"]+)"',g)
          assert len(stats)==92 and len(set(stats))==92, len(stats)
          missing=[x for x in stats if ('"'+x+'"') not in engine]
          assert not missing, missing
          print('Mechanically referenced:',len(stats),'of 92')
          PY

      - name: Generate illustrated v0.6 base
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 v060/generate_assets.py
          rm -f app/src/main/java/lt/vaeloria/ooc/WorldMapView.java
          rm -f app/src/main/java/lt/vaeloria/ooc/SceneBannerView.java
          rm -f app/src/main/java/lt/vaeloria/ooc/CombatBoardView.java
          rm -f app/src/main/java/lt/vaeloria/ooc/CharacterLoadoutView.java
          cp v060/PremiumViews.java app/src/main/java/lt/vaeloria/ooc/PremiumViews.java
          cp v060/PremiumActivity.java app/src/main/java/lt/vaeloria/ooc/PremiumActivity.java

      - name: Install v0.8 polished mobile layer
        run: |
          python3 v070/generate_assets_v070.py
          cp v070/PremiumViewsV070.java app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          cp v070/PolishedActivity.java app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('app/build.gradle')
          s=g.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 18', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '0.8.0'", s)
          g.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml')
          s=m.read_text()
          s=re.sub(r'android:label="Vaeloria OOC [^"]+"', 'android:label="Vaeloria OOC 0.8.0"', s)
          s=s.replace('android:name="lt.vaeloria.ooc.VaeloriaActivity"','android:name="lt.vaeloria.ooc.PolishedActivity"')
          s=s.replace('android:name="lt.vaeloria.ooc.PremiumActivity"','android:name="lt.vaeloria.ooc.PolishedActivity"')
          m.write_text(s)
          PY

      - name: Verify v0.8 presentation and loop
        run: |
          grep -q 'versionCode 18' app/build.gradle
          grep -q "versionName '0.8.0'" app/build.gradle
          grep -q 'lt.vaeloria.ooc.PolishedActivity' app/src/main/AndroidManifest.xml
          grep -q 'R.drawable.world_map_v060' app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          grep -q 'R.drawable.scene_luminara)' app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          grep -q 'R.drawable.combat_forest' app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          grep -q 'R.drawable.hero_einoras' app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          grep -q 'class NpcPortraitV070' app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          grep -q 'BŪSENA ·' app/src/main/java/lt/vaeloria/ooc/PremiumViews.java
          grep -q 'APLINKA ·' app/src/main/java/lt/vaeloria/ooc/PremiumViews.java
          grep -q 'ItemIconView icon=new ItemIconView' app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java
          grep -q 'dp(292)' app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java
          grep -q 'dp(340)' app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java
          grep -q 'scaleX(.985f)' app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java
          grep -q 'NpcPortraitV070' app/src/main/java/lt/vaeloria/ooc/PremiumActivity.java
          test -s app/src/main/res/drawable-nodpi/world_map_v060.png
          test -s app/src/main/res/drawable-nodpi/scene_luminara.png
          test -s app/src/main/res/drawable-nodpi/combat_forest.png
          test -s app/src/main/res/drawable-nodpi/hero_einoras.png

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build v0.8 release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vaeloria-OOC-v0.8.0.apk

      - name: Audit final APK
        run: |
          APK=app/build/outputs/apk/release/Vaeloria-OOC-v0.8.0.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          head -1 apk-badging.txt | tee apk-identity.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-identity.txt
          grep -q "versionCode='18'" apk-identity.txt
          grep -q "versionName='0.8.0'" apk-identity.txt
          grep -q "application-label:'Vaeloria OOC 0.8.0'" apk-badging.txt
          grep -q "launchable-activity: name='lt.vaeloria.ooc.PolishedActivity'" apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          test "$(grep -c '^uses-permission:' apk-permissions.txt)" -eq 1
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest-tree.txt
          if grep -A30 'E: application' apk-manifest-tree.txt | grep -q 'android:debuggable.*0xffffffff'; then echo 'APK is debuggable'; exit 1; fi
          grep -A30 'E: application' apk-manifest-tree.txt | grep -q 'android:allowBackup.*0x0'
          grep -A30 'E: application' apk-manifest-tree.txt | grep -q 'android:usesCleartextTraffic.*0x0'
          "$AAPT" dump resources "$APK" | tee apk-resources.txt
          grep -q 'world_map_v060' apk-resources.txt
          grep -q 'scene_luminara' apk-resources.txt
          grep -q 'hero_einoras' apk-resources.txt
          CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "APK signer SHA256=$CERT"
          test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
          "$APKSIGNER" verify --verbose "$APK"
          if unzip -p "$APK" classes.dex | strings | grep -E 'gsk_[A-Za-z0-9_-]{16,}' >/dev/null; then echo 'Hardcoded Groq key detected'; exit 1; fi
          unzip -p "$APK" classes.dex | strings | grep -q 'PolishedActivity'
          unzip -p "$APK" classes.dex | strings | grep -q 'NpcPortraitV070'
          unzip -p "$APK" classes.dex | strings | grep -q 'Manifesto neatitikimas'
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.8.0-apk
          path: vaeloria-android/app/build/outputs/apk/release/Vaeloria-OOC-v0.8.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.8.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.8.0 \
            app/build/outputs/apk/release/Vaeloria-OOC-v0.8.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vaeloria OOC v0.8.0 · Playable Polish" \
            --notes "v0.8.0 sujungia v0.7 mobilų UX su stipresne v0.6 fantasy art kryptimi ir sutvarkytu realiu žaidimo loop'u. Grąžintas iliustruotas atlasas su teisingomis lokacijų koordinatėmis; ŽAISTI ekranas naudoja iliustruotas Luminara/wilderness scenas; Einoro ekranas naudoja pilną hero artwork; visi Luminara NPC turi portretinį pateikimą; combat rodo priešo ketinimą, būseną ir aplinkos pavojų; inventorius naudoja turtingesnes item ikonas; pridėtas mikroanimacijų/haptikos polish. Svarbiausia: be Groq rakto pasirinkimai ir laisvi veiksmai nebėra tuščias persikrovimas — local resolveris keičia sceną, laiką, resursus, kelionę ir combat būseną bei viską išsaugo SQLite. Groq GM lieka pasirenkamas aukštesnio lygio naratyvui. Tas pats stabilus signing key, todėl APK skirtas atnaujinti ankstesnę oficialiai pasirašytą Vaeloria versiją."
