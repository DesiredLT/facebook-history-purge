name: Release Vaeloria OOC v0.9.2

on:
  push:
    branches: [agent/vaeloria-v091]
  pull_request:
    branches: [agent/vaeloria-v091]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify upgrade-compatible signing identity
        run: |
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Catalog, drop-table, source and raster acceptance audit
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          cd ..
          python3 v092/audit_v092.py

      - name: Unit, catalog, drop and resolver-contract tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real 360dp UI, potion, drop and SQLite v3-to-v6 tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell wm size 360x800
            adb shell wm density 160
            gradle -p vaeloria-android :app:connectedDebugAndroidTest --stacktrace

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vaeloria-OOC-v0.9.2.apk

      - name: APK, package, permissions, resources and signer audit
        run: |
          APK=app/build/outputs/apk/release/Vaeloria-OOC-v0.9.2.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging-v092.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-badging-v092.txt
          grep -q "versionCode='32'" apk-badging-v092.txt
          grep -q "versionName='0.9.2'" apk-badging-v092.txt
          grep -q "application-label:'Vaeloria OOC 0.9.2'" apk-badging-v092.txt
          grep -q "launchable-activity: name='lt.vaeloria.ooc.PolishedActivity'" apk-badging-v092.txt

          "$AAPT" dump permissions "$APK" | tee apk-permissions-v092.txt
          test "$(grep -c '^uses-permission:' apk-permissions-v092.txt)" -eq 1
          grep -q 'android.permission.INTERNET' apk-permissions-v092.txt

          "$AAPT" dump resources "$APK" | tee apk-resources-v092.txt
          for number in $(seq -w 1 325); do
            grep -q "item_v092_$number" apk-resources-v092.txt
          done
          for number in $(seq -w 1 200); do
            grep -q "monster_v091_$number" apk-resources-v092.txt
          done

          CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK"
          if unzip -p "$APK" classes.dex | strings | grep -E 'gsk_[A-Za-z0-9_-]{16,}' >/dev/null; then exit 1; fi
          sha256sum "$APK" | tee apk-sha256-v092.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.9.2-apk-and-audits
          path: |
            vaeloria-android/app/build/outputs/apk/release/Vaeloria-OOC-v0.9.2.apk
            vaeloria-android/apk-badging-v092.txt
            vaeloria-android/apk-permissions-v092.txt
            vaeloria-android/apk-sha256-v092.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.9.2 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.9.2 app/build/outputs/apk/release/Vaeloria-OOC-v0.9.2.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vaeloria OOC v0.9.2 · 325 Illustrated RPG Items" --notes "Vaeloria OOC v0.9.2 adds 325 distinct bundled item illustrations across 19 RPG categories, eight rarity tiers (common, uncommon, rare, epic, legendary, mythic, ancient and unique), levels 1–100, values, power and effects. Ten six-piece equipment sets activate real 2/4/6 bonuses. Fifty-two consumables include working health, mana, stamina and aeonic potions, food and combat items. All 218 illustrated monsters now expose danger- and region-aware drop tables; authoritative victory rolls award 1–3 catalog items with exact rarity probabilities. Combat enemy HP and rounds persist, SQLite migrates in place from v3/v5 to v6, item quantities and full metadata survive export/import, and the item codex is paginated for mobile. CI validates all 325 unique 384×384 WebP assets and retained 200 v0.9.1 monsters, runs catalog/drop/AI/save tests, executes potion, victory-drop and migration flows on a real 360dp Android emulator, audits the APK and verifies the stable upgrade signer."
