name: Build and release Vaeloria OOC v1.1.1

on:
  pull_request:
    branches: [agent/vaeloria-local-android, agent/vaeloria-v100-asset-quality, agent/vaeloria-v101-p0]
    paths:
      - '.github/workflows/vaeloria-v100-release.yml'
      - 'v100/**'
      - 'ai-service/**'
      - 'vaeloria-android/app/**'
      - 'vaeloria-android/build.gradle'
      - 'vaeloria-android/settings.gradle'
  push:
    branches: [agent/vaeloria-local-android, agent/vaeloria-v100-asset-quality, agent/vaeloria-v101-p0]
    paths:
      - '.github/workflows/vaeloria-v100-release.yml'
      - 'v100/**'
      - 'ai-service/**'
      - 'vaeloria-android/app/**'
      - 'vaeloria-android/build.gradle'
      - 'vaeloria-android/settings.gradle'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaeloria-v111-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vaeloria-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Look for legacy signing backup
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1

      - name: Restore and verify release signing identity
        id: signing
        env:
          VAELORIA_KEYSTORE_B64: ${{ secrets.VAELORIA_KEYSTORE_B64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/vaeloria-release.keystore"
          if [ -n "$VAELORIA_KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$VAELORIA_KEYSTORE_B64" | base64 --decode > "$KEY_PATH"
          elif [ -f "$HOME/.android/debug.keystore" ]; then
            cp "$HOME/.android/debug.keystore" "$KEY_PATH"
          fi
          if [ -f "$KEY_PATH" ]; then
            FP=$(keytool -list -v -keystore "$KEY_PATH" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
            echo "VAELORIA_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "VAELORIA_RELEASE_KEYSTORE=$KEY_PATH" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "VAELORIA_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Original signing key is unavailable. Tests and unsigned release verification will run; publication stays blocked."
          fi

      - uses: android-actions/setup-android@v3

      - name: Install Android 35 toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: OpenAI service contract, limits and cancellation tests
        run: node --test ../ai-service/test/*.test.mjs

      - name: Source structure and retained-asset audit
        run: |
          cd ..
          python3 v100/audit_v100.py

      - name: Unit and deterministic-engine tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real 360dp UI, v3-to-v13 migration, undo and save-slot tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell wm size 360x800
            adb shell wm density 160
            gradle -p vaeloria-android :app:connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-test-reports-${{ github.run_id }}
          path: |
            vaeloria-android/app/build/reports/tests/
            vaeloria-android/app/build/reports/androidTests/
            vaeloria-android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Build optimized release APK
        run: |
          gradle :app:assembleRelease --stacktrace
          if [ "$VAELORIA_SIGNED_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vaeloria-OOC-v1.1.1.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Vaeloria-OOC-v1.1.1-unsigned.apk
          fi

      - name: APK identity, security, resources and signer audit
        run: |
          if [ "$VAELORIA_SIGNED_RELEASE" = "true" ]; then
            APK=app/build/outputs/apk/release/Vaeloria-OOC-v1.1.1.apk
          else
            APK=app/build/outputs/apk/release/Vaeloria-OOC-v1.1.1-unsigned.apk
          fi
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$AAPT" dump badging "$APK" | tee apk-badging-v111.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-badging-v111.txt
          grep -q "versionCode='43'" apk-badging-v111.txt
          grep -q "versionName='1.1.1'" apk-badging-v111.txt
          grep -q "application-label:'Vaeloria OOC 1.1.1'" apk-badging-v111.txt
          grep -q "launchable-activity: name='lt.vaeloria.ooc.PolishedActivity'" apk-badging-v111.txt
          if grep -q '^application-debuggable' apk-badging-v111.txt; then exit 1; fi

          "$AAPT" dump permissions "$APK" | tee apk-permissions-v111.txt
          test "$(grep -c '^uses-permission:' apk-permissions-v111.txt)" -eq 1
          grep -q 'android.permission.INTERNET' apk-permissions-v111.txt

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest-v111.txt
          grep -A35 'E: application' apk-manifest-v111.txt | grep -q 'android:allowBackup.*0x0'
          grep -A35 'E: application' apk-manifest-v111.txt | grep -q 'android:usesCleartextTraffic.*0x0'

          "$AAPT" dump resources "$APK" | tee apk-resources-v111.txt
          for number in $(seq -w 1 325); do grep -q "item_v092_$number" apk-resources-v111.txt; done
          for number in $(seq -w 1 200); do grep -q "monster_v091_$number" apk-resources-v111.txt; done
          for resource in hero_einoras_v090 world_map_base_v090 quest_broken_meridian_v090; do grep -q "$resource" apk-resources-v111.txt; done

          test "$(stat -c %s "$APK")" -gt 10000000
          unzip -t "$APK"
          "$ZIPALIGN" -c -P 16 4 "$APK"
          if [ "$VAELORIA_SIGNED_RELEASE" = "true" ]; then
            "$APKSIGNER" verify --verbose "$APK"
            CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
          fi
          if unzip -p "$APK" 'classes*.dex' | strings | grep -E '(gsk_|sk-)[A-Za-z0-9_-]{16,}' >/dev/null; then exit 1; fi
          sha256sum "$APK" | tee apk-sha256-v111.txt

      - name: Upload verified APK and audits
        uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v1.1.1-signed-${{ steps.signing.outputs.signed }}-${{ github.run_id }}
          path: |
            vaeloria-android/app/build/outputs/apk/release/Vaeloria-OOC-v1.1.1*.apk
            vaeloria-android/apk-badging-v111.txt
            vaeloria-android/apk-permissions-v111.txt
            vaeloria-android/apk-manifest-v111.txt
            vaeloria-android/apk-sha256-v111.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/agent/vaeloria-local-android' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view vaeloria-ooc-v1.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TARGET=$(gh release view vaeloria-ooc-v1.1.1 --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            test "$TARGET" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create vaeloria-ooc-v1.1.1 \
            app/build/outputs/apk/release/Vaeloria-OOC-v1.1.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vaeloria OOC v1.1.1 · OpenAI ir patikimumas" \
            --notes-file ../v100/RELEASE-v1.1.1.md
