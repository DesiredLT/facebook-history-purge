name: Vaeloria v0.8.3 Visual Recovery

on:
  push:
    branches: [agent/vaeloria-local-android]
    paths:
      - '.github/workflows/vaeloria-v083-release.yml'
      - 'vaeloria-android/v083/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify signing identity
        run: |
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply gameplay core
        run: |
          python3 tools/patch_stats_button.py
          python3 tools/fix_generated_java.py
          python3 tools/patch_stat_engine_audit.py
          python3 tools/patch_stat_test_aggregate.py
          python3 tools/patch_v040.py
          python3 tools/fix_v040_db_methods.py
          python3 tools/cleanup_v040_lithuanian.py
          python3 tools/patch_v050.py
          python3 tools/patch_v051.py
          python3 tools/patch_v051_lintfix.py
          python3 tools/patch_v080_local.py

      - name: Generate known-good baseline visuals
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 v060/generate_assets.py
          python3 v070/generate_assets_v070.py
          python3 tools/patch_v080_presentation.py
          rm -f app/src/main/java/lt/vaeloria/ooc/WorldMapView.java app/src/main/java/lt/vaeloria/ooc/SceneBannerView.java app/src/main/java/lt/vaeloria/ooc/CombatBoardView.java app/src/main/java/lt/vaeloria/ooc/CharacterLoadoutView.java
          cp v060/PremiumViews.java app/src/main/java/lt/vaeloria/ooc/PremiumViews.java
          cp v060/PremiumActivity.java app/src/main/java/lt/vaeloria/ooc/PremiumActivity.java
          cp v070/PremiumViewsV070.java app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          cp v070/PolishedActivity.java app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java
          python3 v081/generate_assets_v081.py
          python3 v081/patch_v081_ui.py

      - name: Apply v0.8.2 gameplay and UI layer
        run: |
          python3 v082/patch_v082.py
          python3 v082/fix_v082_compile.py
          python3 v082/fix_v082_feedback_parser.py

      - name: Repair all v0.8.x visual entry assets
        run: python3 v083/fix_assets_v083.py

      - name: Set v0.8.3 identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('app/build.gradle');s=g.read_text();s=re.sub(r'versionCode\s+\d+','versionCode 21',s);s=re.sub(r"versionName\s+'[^']+'","versionName '0.8.3'",s);g.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml');s=m.read_text();s=re.sub(r'android:label="Vaeloria OOC [^"]+"','android:label="Vaeloria OOC 0.8.3"',s);s=s.replace('android:name="lt.vaeloria.ooc.VaeloriaActivity"','android:name="lt.vaeloria.ooc.PolishedActivity"').replace('android:name="lt.vaeloria.ooc.PremiumActivity"','android:name="lt.vaeloria.ooc.PolishedActivity"');m.write_text(s)
          p=Path('app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java');s=p.read_text();s=s.replace('v0.8.2','v0.8.3');p.write_text(s)
          PY

      - name: Source and image acceptance audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java').read_text()
          v=Path('app/src/main/java/lt/vaeloria/ooc/PremiumViewsV082.java').read_text()
          a=Path('app/src/main/java/lt/vaeloria/ooc/VaeloriaActivity.java').read_text()
          checks={
            'save resolver':'local(String action,StatEngine.Check check)' in a and 'Manifesto neatitikimas' in a,
            'header':'OOC · LOCAL FIRST' not in p and 'v0.8.3' in p,
            'journal':'"ŽURNALAS"' in p,
            'hero':'hero_einoras_v082' in p and 'LoadoutV082View' in p,
            'scene':'SceneV082View' in p and 'scene_palace_v082' in v,
            'feedback':'feedbackCard082' in p and 'KAIP APSKAIČIUOTA?' in p and 'java.util.regex' not in p,
            'atlas':'WorldMapV082View' in p and 'FRAKCIJOS' in p and 'toggleFactions' in v,
            'quest':'quest_meridian_v082' in p,
            'threads':'PRIORITETAS ' in p and 'Įtampa ' in p and 'Paslaptis ' in p,
            'abilities':'TECHNIKA' in p and 'TOBULINIMAS VIRŠ RIBOS' in p and 'PRINCIPAS VIRŠ RIBOS' in p and 'NEŽINOMA KLASĖ' in p,
            'factions':'FactionStatusV082View' in p,
          }
          for k,x in checks.items(): print(k,'OK' if x else 'FAIL')
          bad=[k for k,x in checks.items() if not x]
          if bad: raise SystemExit('Acceptance failed: '+', '.join(bad))
          res=Path('app/src/main/res/drawable-nodpi')
          required=['hero_einoras_v082.webp','scene_palace_v082.webp','quest_meridian_v082.webp','world_map_v082.webp','hero_einoras.png','scene_luminara.png','quest_meridian.png','world_map_v060.png','combat_forest.png']
          for name in required:
              q=res/name
              raw=q.read_bytes()
              with Image.open(q) as im:
                  im.load(); assert im.width>=300 and im.height>=180,(name,im.size)
                  print('decoded',name,im.size,len(raw))
              if name.endswith('.webp'):
                  assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP',name
          PY

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk

      - name: APK identity security and image audit
        run: |
          APK=app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-badging.txt
          grep -q "versionCode='21'" apk-badging.txt
          grep -q "versionName='0.8.3'" apk-badging.txt
          grep -q "application-label:'Vaeloria OOC 0.8.3'" apk-badging.txt
          grep -q "launchable-activity: name='lt.vaeloria.ooc.PolishedActivity'" apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          test "$(grep -c '^uses-permission:' apk-permissions.txt)" -eq 1
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
          "$APKSIGNER" verify --verbose "$APK"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io,re,zipfile
          apk=Path('app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk')
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              visual=[n for n in names if n.startswith('res/') and n.lower().endswith(('.png','.webp'))]
              webps=[n for n in visual if n.lower().endswith('.webp')]
              assert len(webps)>=4,webps
              for n in visual:
                  raw=z.read(n)
                  with Image.open(io.BytesIO(raw)) as im:
                      im.load(); assert im.width>0 and im.height>0,(n,im.size)
                  if n.lower().endswith('.webp'):
                      assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP',n
              dex=b''.join(z.read(n) for n in names if re.fullmatch(r'classes\d*\.dex',n))
              assert not re.search(rb'gsk_[A-Za-z0-9_-]{16,}',dex), 'Groq key found in APK'
              print('APK visuals decoded:',len(visual),'including',len(webps),'WebP files')
          PY
          sha256sum "$APK" | tee apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.8.3-apk
          path: vaeloria-android/app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.8.3 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.8.3 app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vaeloria OOC v0.8.3 · Visual Recovery" --notes "Fixes the v0.8.2 runtime visual regression. The four main visual entry assets are rebuilt as valid, decodable WebP images from the last known-good bundled artwork. The release pipeline now decodes every PNG/WebP inside the final APK so corrupted image files cannot pass CI again. Existing SQLite saves, local resolver, Groq AI GM, package ID and Android signing identity are preserved."
