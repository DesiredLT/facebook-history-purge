name: Release Vaeloria v0.8.3 Audit Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaeloria-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vaeloria-android-debug-signing-v1
          fail-on-cache-miss: true
      - name: Verify signing identity
        run: |
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$FP" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply gameplay core
        run: |
          python3 tools/patch_stats_button.py
          python3 tools/fix_generated_java.py
          python3 tools/patch_stat_engine_audit.py
          python3 tools/patch_stat_test_aggregate.py
          python3 tools/patch_v040.py
          python3 tools/fix_v040_db_methods.py
          python3 tools/cleanup_v040_lithuanian.py
          python3 tools/patch_v050.py
          python3 tools/patch_v051.py
          python3 tools/patch_v051_lintfix.py
          python3 tools/patch_v080_local.py
      - name: Generate v0.8.1 baseline
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 v060/generate_assets.py
          python3 v070/generate_assets_v070.py
          python3 tools/patch_v080_presentation.py
          rm -f app/src/main/java/lt/vaeloria/ooc/WorldMapView.java app/src/main/java/lt/vaeloria/ooc/SceneBannerView.java app/src/main/java/lt/vaeloria/ooc/CombatBoardView.java app/src/main/java/lt/vaeloria/ooc/CharacterLoadoutView.java
          cp v060/PremiumViews.java app/src/main/java/lt/vaeloria/ooc/PremiumViews.java
          cp v060/PremiumActivity.java app/src/main/java/lt/vaeloria/ooc/PremiumActivity.java
          cp v070/PremiumViewsV070.java app/src/main/java/lt/vaeloria/ooc/PremiumViewsV070.java
          cp v070/PolishedActivity.java app/src/main/java/lt/vaeloria/ooc/PolishedActivity.java
          python3 v081/generate_assets_v081.py
          python3 v081/patch_v081_ui.py
      - name: Apply v0.8.2 functional layer
        run: |
          python3 v082/patch_v082.py
          python3 v082/fix_v082_assets.py
          python3 v082/fix_v082_compile.py
          python3 v082/fix_v082_feedback_parser.py
      - name: Apply v0.8.3 audit fixes
        run: |
          python3 v083/prepare_v083_assets.py
          python3 v083/apply_v083.py
          python3 v083/post_v083.py
      - name: Set v0.8.3 identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('app/build.gradle');s=g.read_text();s=re.sub(r'versionCode\s+\d+','versionCode 22',s);s=re.sub(r"versionName\s+'[^']+'","versionName '0.8.3'",s);g.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml');s=m.read_text();s=re.sub(r'android:label="Vaeloria OOC [^"]+"','android:label="Vaeloria OOC 0.8.3"',s);s=s.replace('android:name="lt.vaeloria.ooc.VaeloriaActivity"','android:name="lt.vaeloria.ooc.PolishedActivity"').replace('android:name="lt.vaeloria.ooc.PremiumActivity"','android:name="lt.vaeloria.ooc.PolishedActivity"');m.write_text(s)
          PY
      - name: Acceptance audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          S=Path('app/src/main/java/lt/vaeloria/ooc')
          p=(S/'PolishedActivity.java').read_text(encoding='utf-8');v=(S/'PremiumViewsV082.java').read_text(encoding='utf-8');gs=(S/'GameState.java').read_text(encoding='utf-8');gc=(S/'GroqClient.java').read_text(encoding='utf-8');va=(S/'VaeloriaActivity.java').read_text(encoding='utf-8');inv=(S/'PremiumViews.java').read_text(encoding='utf-8')
          checks={'visible v083':'v0.8.3' in p and 'v0.8.2"' not in p,'new hero':'hero_einoras_v083' in p and 'hero_einoras_v082' not in p,'new palace scene':'scene_palace_v083' in v and 'scene_palace_v082' not in v,'new quest key art':'quest_meridian_v083' in p and 'quest_meridian_v082' not in p,'new atlas':'world_map_v083' in v and 'world_map_v082' not in v,'dynamic faction view':'state.asterraInfluence' in v and 'val={34,72,24}' not in v,'distinct faction emblems':'void emblem(Canvas c,int i' in v,'save compatible faction fields':'optInt("asterraInfluence"' in gs and 'o.put("asterraInfluence"' in gs,'offline faction consequences':'asterra_delta' in va and 'dravennDelta' in va,'AI faction consequences':'asterra_delta' in gc and 'Frakcijos: Asterra' in gc,'44dp touch target':'bh=dp(44)' in v,'inventory prism':'n.contains("prizm")' in inv,'inventory seed':'n.contains("seed")' in inv,'inventory relic':'n.contains("relic")' in inv,'journal nav':'"ŽURNALAS"' in p,'collapsed feedback':'KAIP APSKAIČIUOTA?' in p}
          for k,x in checks.items(): print(k,'OK' if x else 'FAIL')
          bad=[k for k,x in checks.items() if not x]
          if bad: raise SystemExit('Acceptance failed: '+', '.join(bad))
          res=Path('app/src/main/res/drawable-nodpi');expected={'hero_einoras_v083.webp':(540,720),'scene_palace_v083.webp':(720,300),'quest_meridian_v083.webp':(720,360),'world_map_v083.webp':(600,930)}
          for f,sz in expected.items():
            q=res/f
            with Image.open(q) as im:
              im.load(); assert im.format=='WEBP' and im.size==sz,(f,im.format,im.size);colors=len(set(im.resize((32,32)).convert('RGB').getdata()));assert colors>120,(f,colors);print(f,'DECODE OK',im.size,'colors',colors)
          assert 360/5 >= 44 and 'bh=dp(44)' in v
          print('360dp MOBILE STATIC GATE OK')
          PY
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk
      - name: APK audit
        run: |
          APK=app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt";APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "name='lt.vaeloria.ooc.personal'" apk-badging.txt;grep -q "versionCode='22'" apk-badging.txt;grep -q "versionName='0.8.3'" apk-badging.txt;grep -q "application-label:'Vaeloria OOC 0.8.3'" apk-badging.txt;grep -q "launchable-activity: name='lt.vaeloria.ooc.PolishedActivity'" apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt;test "$(grep -c '^uses-permission:' apk-permissions.txt)" -eq 1;grep -q 'android.permission.INTERNET' apk-permissions.txt
          "$AAPT" dump resources "$APK" | tee apk-resources.txt
          for r in hero_einoras_v083 scene_palace_v083 quest_meridian_v083 world_map_v083; do grep -q "$r" apk-resources.txt; done
          CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]');test "$CERT" = "07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88";"$APKSIGNER" verify --verbose "$APK"
          if unzip -p "$APK" classes.dex | strings | grep -E 'gsk_[A-Za-z0-9_-]{16,}' >/dev/null; then exit 1; fi
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vaeloria-ooc-v0.8.3-apk
          path: vaeloria-android/app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vaeloria-ooc-v0.8.3 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create vaeloria-ooc-v0.8.3 app/build/outputs/apk/release/Vaeloria-OOC-v0.8.3.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vaeloria OOC v0.8.3 · Audit Fix" --notes "Closes the v0.8.2 audit gaps: new bundled premium raster art for Einoras, palace scene, Meridian quest and world atlas; persistent/reactive faction state in save data, local resolver and Groq turns; distinct faction emblems; prism/seed/relic glyph differentiation; 44dp loadout targets; same package ID and signing identity. CI validates real image decode, source acceptance, unit tests, APK resources, permissions and signer before release."
