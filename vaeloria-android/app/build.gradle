plugins {
    id 'com.android.application'
}

android {
    namespace 'lt.vaeloria.ooc'
    compileSdk 35

    defaultConfig {
        applicationId 'lt.vaeloria.ooc.personal'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.5.0'
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        vaeloriaStable {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.vaeloriaStable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.vaeloriaStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
