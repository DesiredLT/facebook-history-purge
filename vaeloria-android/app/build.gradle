plugins {
    id 'com.android.application'
}

def releaseKeyPath = System.getenv('VAELORIA_RELEASE_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore"
def releaseKeyAvailable = System.getenv('CI') == 'true'
        ? System.getenv('VAELORIA_SIGNED_RELEASE') == 'true' : file(releaseKeyPath).exists()

android {
    namespace 'lt.vaeloria.ooc'
    compileSdk 35

    defaultConfig {
        applicationId 'lt.vaeloria.ooc.personal'
        minSdk 26
        targetSdk 35
        versionCode 43
        versionName '1.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        test.resources.srcDir 'src/main/assets'
    }

    signingConfigs {
        vaeloriaStable {
            storeFile file(releaseKeyPath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            debuggable false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeyAvailable) signingConfig signingConfigs.vaeloriaStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
