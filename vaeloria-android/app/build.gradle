plugins {
    id 'com.android.application'
}

android {
    namespace 'lt.vaeloria.ooc'
    compileSdk 35

    defaultConfig {
        applicationId 'lt.vaeloria.ooc.stable'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.3.2'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
