plugins {
    id 'com.android.application'
}

def releaseKeyPath = System.getenv('VAELORIA_RELEASE_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore"
def releaseKeyAvailable = System.getenv('CI') == 'true'
        ? System.getenv('VAELORIA_SIGNED_RELEASE') == 'true' : file(releaseKeyPath).exists()

android {
    namespace 'lt.vaeloria.ooc'
    compileSdk 35

    defaultConfig {
        applicationId 'lt.vaeloria.ooc.personal'
        minSdk 26
        targetSdk 35
        versionCode 44
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        test.resources.srcDir 'src/main/assets'
    }

    signingConfigs {
        vaeloriaStable {
            storeFile file(releaseKeyPath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            debuggable false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeyAvailable) signingConfig signingConfigs.vaeloriaStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}


def validateStableSigner = tasks.register('validateStableSigner') {
    doLast {
        if (!releaseKeyAvailable) return
        def keyStore = java.security.KeyStore.getInstance('JKS')
        file(releaseKeyPath).withInputStream { stream -> keyStore.load(stream, 'android'.toCharArray()) }
        def certificate = keyStore.getCertificate('androiddebugkey')
        if (certificate == null) throw new GradleException('Original Vaeloria signing certificate is missing.')
        def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString().toUpperCase(java.util.Locale.ROOT)
        if (fingerprint != '07F9E852AF8F51562E2F621B270BB2097C9CA00E433B633D4F85A3EEAC746C88') {
            throw new GradleException('Release signer differs from the installed Vaeloria application. Restore the original key; do not replace it.')
        }
    }
}
tasks.configureEach { task -> if (task.name == 'preReleaseBuild') task.dependsOn(validateStableSigner) }
